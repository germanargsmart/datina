# Actualiza los datos y la pagina el dia 5 de cada mes (y a pedido desde la pestana Actions)
name: Actualizar datos
on:
  schedule:
    - cron: "0 12 5 * *"
  workflow_dispatch:
permissions:
  contents: write
# una sola actualizacion a la vez: si se lanza otra a mano mientras corre la del dia 5, espera a que termine (plan de estabilizacion, P2-4)
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  actualizar:
    # maquina fija (ubuntu-latest pasa a Ubuntu 26 desde el 19 de octubre de 2026) y las versiones de las acciones que corren en Node 24
    runs-on: ubuntu-24.04
    # las corridas tardan de 18 a 51 minutos: si una se cuelga (una fuente que no responde), se corta a las dos horas
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/01_descargar.py
        # la API del INDEC (docs/deploy/INDEC_API.md): sin el secreto, esas tablas no se bajan y el resto sigue igual
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
      - run: python scripts/02_procesar.py
      # si una prueba de los datos falla, el trabajo se detiene acá y no se publica nada
      - run: python scripts/pruebas_datos.py
      - run: python scripts/03_construir_sitio.py
      # revisa las paginas armadas en Chrome sin ventana (scripts/prueba_paginas.mjs): sin errores, sin NaN ni undefined en los
      # textos y "En cifras" completa. Si algo falla, el trabajo se detiene aca y no se guarda ni se publica nada
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # la prueba de paginas usa el Chrome que trae la maquina de GitHub: queda anotada su version por si un dia cambia y falla
      - name: Version de Chrome
        run: google-chrome --version
      - run: node scripts/prueba_paginas.mjs
      # sube lo bajado y lo armado. Si mientras corria se unio otra cosa a la rama, vuelve a armar sobre ella con lo que bajo 01 y lo prueba
      # igual antes de subir: el 5 de noviembre de 2026 la corrida 34 no se guardo porque el PR #95 se unio mientras corria y cambiaba las
      # mismas paginas (scripts/guardar_actualizacion.sh, y su prueba scripts/prueba_guardar_actualizacion.sh)
      - name: Guardar cambios
        run: bash scripts/guardar_actualizacion.sh
