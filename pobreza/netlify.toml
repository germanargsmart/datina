# Netlify arma el sitio con "npm run build" y publica la carpeta dist.
# Los archivos Parquet ya vienen generados en src/data, así que Netlify no necesita Python.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Los archivos de dist/_file y dist/_npm llevan un código en el nombre que cambia cuando cambia
# el contenido, así que se pueden guardar en caché mucho tiempo.
[[headers]]
  for = "/_file/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_npm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
